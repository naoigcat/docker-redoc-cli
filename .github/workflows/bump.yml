name: Bump Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          fetch-depth: 0
      -
        name: Setup Node.js with version 18
        uses: actions/setup-node@v6
        with:
          node-version: 18
          package-manager-cache: false
      -
        name: Get Node.js versions
        shell: bash
        run: |
          set -euo pipefail
          today="$(date +%F)"
          node_versions="$(
            curl -fsSL https://raw.githubusercontent.com/nodejs/Release/main/schedule.json |
            jq -r --arg today "$today" '[to_entries[] | select(.value.lts and .value.start <= $today and .value.end >= $today) | .key | sub("^v"; "")] | join(" ")'
          )"
          printf '%s\n' "$node_versions" | grep -Eq '^[0-9]+( [0-9]+)*$'
          printf 'NODE_VERSIONS=%s\n' "$node_versions" | tee -a "$GITHUB_ENV" >&2
      -
        name: Get Redoc CLI versions
        shell: bash
        run: |
          set -euo pipefail
          first_node="${NODE_VERSIONS%% *}"
          latest_tag="$(git tag --sort=-authordate --list "*-node${first_node}" | head -n 1)"
          test -n "$latest_tag"
          latest_package_version="${latest_tag%-node${first_node}}"
          versions_json="$(npm view -s "redoc-cli@>${latest_package_version}" version --json 2>/dev/null || true)"
          if test -n "$versions_json"
          then
            package_versions="$(
              printf '%s' "$versions_json" |
              jq -r 'if type == "array" then .[] elif type == "string" then . else empty end' |
              tr '\n' ' ' |
              sed -e 's/ $//'
            )"
          else
            package_versions=""
          fi
          if test -n "$package_versions"
          then
            printf '%s\n' "$package_versions" | grep -Eq '^[0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?( [0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?)*$'
          fi
          printf 'PACKAGE_VERSIONS=%s\n' "$package_versions" | tee -a "$GITHUB_ENV" >&2
      -
        name: Bump
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PACKAGE_VERSIONS:-}" && exit 0 || :
          printf '%s\n' "$NODE_VERSIONS" | grep -Eq '^[0-9]+( [0-9]+)*$'
          printf '%s\n' "$PACKAGE_VERSIONS" | grep -Eq '^[0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?( [0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?)*$'

          first_node="${NODE_VERSIONS%% *}"
          latest_tag="$(git tag --sort=-authordate --list "*-node${first_node}" | head -n 1)"
          test -n "$latest_tag"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo git checkout -b \"node${first_node}\" \"$latest_tag\" | tee /dev/stderr | source /dev/stdin
          if test "$(git diff --numstat main | wc -l)" -gt 0
          then
            echo git reset --hard HEAD~ | tee /dev/stderr | source /dev/stdin
            echo git merge --no-ff --no-commit main | tee /dev/stderr | source /dev/stdin
            echo git checkout HEAD -- Dockerfile | tee /dev/stderr | source /dev/stdin
            echo git commit -m \"Merge branch 'main' to $(git rev-parse --abbrev-ref HEAD)\" | tee /dev/stderr | source /dev/stdin
          else
            echo git reset --hard HEAD~ | tee /dev/stderr | source /dev/stdin
          fi

          for package in $PACKAGE_VERSIONS
          do
            echo git checkout \"node${first_node}\" | tee /dev/stderr | source /dev/stdin
            echo sed -i -E \"s/redoc-cli@[0-9A-Za-z.+-]+/redoc-cli@${package}/\" Dockerfile | tee /dev/stderr | source /dev/stdin
            echo git commit -am \"Bump redoc-cli to ${package}\" | tee /dev/stderr | source /dev/stdin
            echo git tag \"${package}-node${first_node}\" | tee /dev/stderr | source /dev/stdin
            echo git push origin \"$(git describe --tags)\" | tee /dev/stderr | source /dev/stdin
            sleep 60

            previous="$first_node"
            for node in $NODE_VERSIONS
            do
              test "$node" = "$first_node" && continue
              if test "$(git branch --list "node${node}" | wc -l)" -eq 0
              then
                node_tag="$(git describe --tags | sed -E "s/[0-9]+$/${node}/")"
                if git rev-parse "$node_tag" >/dev/null 2>&1
                then
                  echo git branch \"node${node}\" \"$node_tag\" | tee /dev/stderr | source /dev/stdin
                else
                  echo sed -i -E \"s/node:[0-9]+-slim/node:${node}-slim/\" Dockerfile | tee /dev/stderr | source /dev/stdin
                  echo git commit -am \"Bump Node.js to ${node}\" | tee /dev/stderr | source /dev/stdin
                  echo git checkout -b \"node${node}\" | tee /dev/stderr | source /dev/stdin
                  echo git checkout \"node${first_node}\" | tee /dev/stderr | source /dev/stdin
                fi
              else
                echo git checkout \"node${node}\" | tee /dev/stderr | source /dev/stdin
              fi
              echo git merge --no-ff --no-commit \"node${previous}\" | tee /dev/stderr | source /dev/stdin
              echo sed -i -E \"s/node:[0-9]+-slim/node:${node}-slim/\" Dockerfile | tee /dev/stderr | source /dev/stdin
              echo git commit --all --reuse-message=\"node${previous}\" | tee /dev/stderr | source /dev/stdin
              echo git tag \"${package}-node${node}\" | tee /dev/stderr | source /dev/stdin
              echo git push origin \"$(git describe --tags)\" | tee /dev/stderr | source /dev/stdin
              sleep 60
              previous="$node"
            done
          done
          last_node="${NODE_VERSIONS##* }"
          echo git checkout main | tee /dev/stderr | source /dev/stdin
          echo git merge --ff \"node${last_node}\" | tee /dev/stderr | source /dev/stdin
          echo git push origin main | tee /dev/stderr | source /dev/stdin
